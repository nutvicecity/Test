name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: GTR-Speedometer-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Rename YT MP3 APK
        run: cp ytmp3/build/outputs/apk/release/ytmp3-release.apk YT-MP3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YT-MP3-apk
          path: YT-MP3.apk

      # Direct download link: Releases -> "ytmp3-latest" -> YT-MP3.apk
      - name: Publish YT MP3 release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ytmp3-latest --yes --cleanup-tag || true
          gh release create ytmp3-latest YT-MP3.apk --prerelease \
            --target "$GITHUB_SHA" --title "YT MP3 (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install YT-MP3.apk on Android 7.0+."
